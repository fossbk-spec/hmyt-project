name: Validate Submission

# Chạy trên mọi PR nhắm vào main — đây là lưới chặn bắt buộc trước khi
# merge (kết hợp với branch protection yêu cầu check này phải xanh).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Checkout của sự kiện pull_request là merge commit giả định (PR gộp vào
      # main): parent 1 = main, nên HEAD^1..HEAD = đúng phần thay đổi của PR.
      # KHÔNG dùng origin/<head_ref>: nhánh của fork sinh viên không tồn tại
      # trên origin, và nhúng tên nhánh (do người mở PR đặt) vào lệnh shell
      # có nguy cơ script injection.
      - name: Liệt kê file thay đổi trong PR
        run: |
          git diff --name-only HEAD^1 HEAD > changed_files.txt
          echo "== File thay đổi trong PR =="
          cat changed_files.txt

      # Chạy validator của NHÁNH ĐÍCH (HEAD^1 = main), không phải bản trong PR:
      # nếu chạy bản trong PR, một PR từ fork có thể sửa chính script này để
      # luôn PASS. Đặt bản sao trong scripts/ để ROOT (= parent.parent) vẫn trỏ
      # đúng thư mục repo đang checkout. Thay đổi validator chỉ có hiệu lực
      # sau khi được merge (qua CODEOWNERS).
      - name: Kiểm tra cách ly + schema + dữ liệu nhạy cảm (validator của main)
        run: |
          git show HEAD^1:scripts/validate_submission.py > scripts/.validate_submission_base.py
          python scripts/.validate_submission_base.py --pr-files changed_files.txt
